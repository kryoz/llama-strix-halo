[*]
flash-attn = on
mlock = on
mmap = off
fit-target = 12288
split-mode = none
warmup = on
ubatch-size = 2048
batch-size  = 4096
jinja = true
metrics = on
direct-io = on
ctx-checkpoints = 8
checkpoint-min-step = 2048
context-shift = on
cache-prompt = true
cache-reuse = 512
cache-ram = 8192
cache-idle-slots = on
slot-prompt-similarity = 0.80
top-k = 20
top-p = 0.95
min-p = 0.01
temp = 0.6
presence-penalty = 0.0
repeat-penalty = 1.05
swa-full = off
no-context-shift = true

# thinking
reasoning = off
reasoning-budget = 0
chat-template-kwargs = {"enable_thinking":false}

# spec decoding
spec-type = draft-mtp
spec-ngram-map-k-size-n = 6
spec-ngram-map-k-size-m = 4
spec-draft-n-min = 1
spec-draft-n-max = 3
spec-draft-p-min = 0.85

[qwen3.5-122B]
model = /home/user/models/Qwen3.5-122B-A10B-MTP-GGUF/UD-Q6_K/Qwen3.5-122B-A10B-UD-Q6_K-00001-of-00004.gguf
# MTP performs well here because the baseline PP starts at ~1060 / 2 = 530 tok/s 
# BUT it consumes extra 1.6Gb RAM when a headroom is not so large.
# Switching to ngram to boosts PP and save RAM for extra context.
#spec-type = ngram-map-k
#spec-draft-n-max = 10
batch-size = 2048
cache-ram = 2500
load-on-startup = true

[qwen3.6-27B]
model = /home/user/models/Qwen3.6-27B-GGUF/Qwopus3.6-27B-v2-MTP-Q8_0.gguf
#mmproj = /home/user/models/Qwen3.6-27B-GGUF/mmproj-BF16.gguf
# I switched back to ngram-map-k from draft-mtp 'cause MTP dropped down prompt processing by 50% which makes it unusable
spec-type = ngram-map-k
spec-draft-n-max = 8

